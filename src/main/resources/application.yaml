spring:
  application:
    name: reconbridge

  datasource:
    url: jdbc:mysql://localhost:3306/reconbridge?connectionTimeZone=UTC
    username: reconbridge_app
    password: ${RECONBRIDGE_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    clean-disabled: true
    baseline-on-migrate: false

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

reconbridge:
  security:
    issuer: http://localhost:8081/realms/reconbridge
    jwk-set-uri: http://localhost:8081/realms/reconbridge/protocol/openid-connect/certs
    audience: reconbridge-api