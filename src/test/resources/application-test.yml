spring:
  datasource:
    url: jdbc:mysql://localhost:3306/reconbridge_test?connectionTimeZone=UTC
    username: reconbridge_test_app
    password: ${RECONBRIDGE_TEST_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    clean-disabled: true
    baseline-on-migrate: false

reconbridge:
  security:
    issuer: http://localhost:8081/realms/reconbridge
    jwk-set-uri: http://localhost:8081/realms/reconbridge/protocol/openid-connect/certs
    audience: reconbridge-api